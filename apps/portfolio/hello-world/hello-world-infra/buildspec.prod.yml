version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_REGION: us-east-1
  exported-variables:
    - WEB_URL
    - API_BASE_URL

phases:
  install:
    commands:
      - 'export PNPM_VERSION=$(node -p "require(\"./package.json\").packageManager.match(/^pnpm@(.*?)(\\+|$)/)[1]")'
      - export PNPM_HOME=/tmp/pnpm
      - 'export PATH="${PNPM_HOME}/bin:${PATH}"'
      - npm install --global --prefix "${PNPM_HOME}" "pnpm@${PNPM_VERSION}"
      - pnpm config set store-dir .pnpm-store
      - pnpm install --frozen-lockfile
  build:
    commands:
      - pnpm -r --filter hello-world-web --filter hello-world-api --filter hello-world-infra run build
      - pnpm --filter hello-world-infra run deploy:ci:no-build
      - 'export WEB_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey==''WebUrl''].OutputValue | [0]" --output text)'
      - 'export API_BASE_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey==''ApiBaseUrl''].OutputValue | [0]" --output text)'
      - test "$WEB_URL" != "None"
      - test "$API_BASE_URL" != "None"
      - 'echo "Web URL: $WEB_URL"'
      - 'echo "API URL: $API_BASE_URL"'
