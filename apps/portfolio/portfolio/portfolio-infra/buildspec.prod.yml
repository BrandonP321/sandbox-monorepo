version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_REGION: us-east-1
  exported-variables:
    - WEB_URL
    - WEB_BUCKET_NAME
    - WEB_DISTRIBUTION_ID

phases:
  install:
    commands:
      - 'export PNPM_VERSION=$(node -p "require(\"./package.json\").packageManager.match(/^pnpm@(.*?)(\\+|$)/)[1]")'
      - export PNPM_HOME=/tmp/pnpm
      - export PATH="${PNPM_HOME}/bin:${PATH}"
      - npm install --global --prefix "${PNPM_HOME}" "pnpm@${PNPM_VERSION}"
      - pnpm config set store-dir .pnpm-store
      - pnpm install --frozen-lockfile
  build:
    commands:
      - pnpm --filter portfolio-infra run build
      - pnpm --filter portfolio-infra run deploy:ci:no-build
      - 'export WEB_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey==''WebUrl''].OutputValue | [0]" --output text)'
      - 'export WEB_BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey==''WebBucketName''].OutputValue | [0]" --output text)'
      - 'export WEB_DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey==''WebDistributionId''].OutputValue | [0]" --output text)'
      - test "$WEB_URL" != "None"
      - test "$WEB_BUCKET_NAME" != "None"
      - test "$WEB_DISTRIBUTION_ID" != "None"
      - pnpm --filter portfolio-infra run publish:web
      - 'echo "Web URL: $WEB_URL"'
