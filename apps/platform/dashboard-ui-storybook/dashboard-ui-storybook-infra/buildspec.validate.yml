version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_REGION: us-east-1

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - 'export PNPM_VERSION=$(node -p "require(\"./package.json\").packageManager.match(/^pnpm@(.*?)(\\+|$)/)[1]")'
      - export PNPM_HOME=/tmp/pnpm
      - export PATH="${PNPM_HOME}/bin:${PATH}"
      - npm install --global --prefix "${PNPM_HOME}" "pnpm@${PNPM_VERSION}"
      - pnpm config set store-dir .pnpm-store
      - pnpm install --frozen-lockfile
  build:
    commands:
      - pnpm -r --filter @repo/dashboard-ui... --filter dashboard-ui-storybook-infra... run lint
      - pnpm -r --filter @repo/dashboard-ui... --filter dashboard-ui-storybook-infra... run typecheck
      - pnpm -r --filter @repo/dashboard-ui^... --filter dashboard-ui-storybook-infra... run test
      - pnpm --filter @repo/dashboard-ui run test:unit
      - pnpm -r --workspace-concurrency=1 --filter @repo/dashboard-ui... --filter dashboard-ui-storybook-infra... run build
      - pnpm --filter @repo/dashboard-ui run build-storybook
