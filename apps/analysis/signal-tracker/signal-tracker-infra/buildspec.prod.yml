version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_REGION: us-east-1
  exported-variables:
    - WEB_URL
    - API_BASE_URL

cache:
  paths:
    - .pnpm-store/**/*

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - 'export PNPM_VERSION=$(node -p "require(\"./package.json\").packageManager.match(/^pnpm@(.*?)(\\+|$)/)[1]")'
      - corepack enable
      - corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - pnpm config set store-dir .pnpm-store
      - pnpm install --frozen-lockfile
  build:
    commands:
      - pnpm -r --filter signal-tracker-web... --filter signal-tracker-api... --filter signal-tracker-infra... run lint
      - pnpm -r --filter signal-tracker-web... --filter signal-tracker-api... --filter signal-tracker-infra... run typecheck
      - pnpm -r --filter signal-tracker-web... --filter signal-tracker-api... --filter signal-tracker-infra... run test
      - pnpm -r --filter signal-tracker-web... --filter signal-tracker-api... --filter signal-tracker-infra... run build
      - pnpm --filter signal-tracker-infra run deploy:ci:no-build
      - 'export WEB_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey==''WebUrl''].OutputValue | [0]" --output text)'
      - 'export API_BASE_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey==''ApiBaseUrl''].OutputValue | [0]" --output text)'
      - test "$WEB_URL" != "None"
      - test "$API_BASE_URL" != "None"
      - 'echo "Web URL: $WEB_URL"'
      - 'echo "API URL: $API_BASE_URL"'
