name: Project CI/CD

on:
  workflow_call:
    inputs:
      project_root:
        required: true
        type: string
      web_package:
        required: true
        type: string
      api_package:
        required: true
        type: string
      infra_package:
        required: true
        type: string
      shared_package:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      deploy_pipeline_name:
        required: true
        type: string
      deploy_pipeline_source_action_name:
        required: true
        type: string

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.range.outputs.base_sha }}
      head_sha: ${{ steps.range.outputs.head_sha }}
      matched_files: ${{ steps.changed.outputs.matched_files }}
      reason: ${{ steps.changed.outputs.reason }}
      should_run: ${{ steps.changed.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base_sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
            echo "head_sha=$PUSH_HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - id: changed
        run: |
          node scripts/project-changed.mjs \
            --base "${{ steps.range.outputs.base_sha }}" \
            --head "${{ steps.range.outputs.head_sha }}" \
            --project-root "${{ inputs.project_root }}"

      - name: Report change detection
        run: |
          echo "should_run=${{ steps.changed.outputs.should_run }}"
          echo "reason=${{ steps.changed.outputs.reason }}"
          echo "matched_files=${{ steps.changed.outputs.matched_files }}"

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: pnpm-version
        run: |
          version=$(node -p 'require("./package.json").packageManager.match(/^pnpm@(.*?)(\\+|$)/)[1]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: ${{ steps.pnpm-version.outputs.version }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/ui exec playwright install chromium

      - name: Lint
        run: |
          pnpm -r \
            --filter "${{ inputs.web_package }}..." \
            --filter "${{ inputs.api_package }}..." \
            --filter "${{ inputs.infra_package }}..." \
            run lint

      - name: Typecheck
        run: |
          pnpm -r \
            --filter "${{ inputs.web_package }}..." \
            --filter "${{ inputs.api_package }}..." \
            --filter "${{ inputs.infra_package }}..." \
            run typecheck

      - name: Test
        run: |
          pnpm -r \
            --filter "${{ inputs.web_package }}..." \
            --filter "${{ inputs.api_package }}..." \
            --filter "${{ inputs.infra_package }}..." \
            run test

      - name: Build
        run: |
          pnpm -r \
            --filter "${{ inputs.web_package }}..." \
            --filter "${{ inputs.api_package }}..." \
            --filter "${{ inputs.infra_package }}..." \
            run build

      - name: CDK synth
        run: pnpm --filter "${{ inputs.infra_package }}" run synth

  deploy-prod:
    needs: [detect-changes, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.should_run == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ inputs.deploy_pipeline_name }}-starter

      - id: start-pipeline
        run: |
          execution_id=$(aws codepipeline start-pipeline-execution \
            --name "${{ inputs.deploy_pipeline_name }}" \
            --source-revisions actionName="${{ inputs.deploy_pipeline_source_action_name }}",revisionType=COMMIT_ID,revisionValue="${{ github.sha }}" \
            --query 'pipelineExecutionId' \
            --output text)
          echo "execution_id=$execution_id" >> "$GITHUB_OUTPUT"
          echo "Started CodePipeline execution $execution_id"

      - name: Wait for deploy pipeline
        env:
          EXECUTION_ID: ${{ steps.start-pipeline.outputs.execution_id }}
        run: |
          while true; do
            status=$(aws codepipeline get-pipeline-execution \
              --pipeline-name "${{ inputs.deploy_pipeline_name }}" \
              --pipeline-execution-id "$EXECUTION_ID" \
              --query 'pipelineExecution.status' \
              --output text)
            timeline_url="https://console.aws.amazon.com/codesuite/codepipeline/pipelines/${{ inputs.deploy_pipeline_name }}/executions/$EXECUTION_ID/timeline?region=${{ inputs.aws_region }}"
            echo "CodePipeline status: $status"
            echo "Timeline: $timeline_url"

            case "$status" in
              Succeeded)
                exit 0
                ;;
              Failed|Cancelled|Stopped|Superseded)
                aws codepipeline list-action-executions \
                  --pipeline-name "${{ inputs.deploy_pipeline_name }}" \
                  --filter pipelineExecutionId="$EXECUTION_ID" \
                  --query 'actionExecutionDetails[?status!=`Succeeded`].[stageName,actionName,status,errorDetails.message]' \
                  --output table
                exit 1
                ;;
            esac

            sleep 20
          done
